<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Chat Command Bot - Mahi</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#F3F5F9;--ink:#0F1B33;--card:#fff;--line:#CBD3E1;--red:#E5262E;--ok:#1F9D74;--mute:#5B6785}
@media(prefers-color-scheme:dark){:root{--bg:#0E1424;--ink:#E9EEF8;--card:#172036;--line:#2B3858;--mute:#93A0BE}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
#logo{width:64px;height:64px;border-radius:14px;object-fit:cover;background:var(--line);flex:none}
h1{font-size:1.6rem;margin:0;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:.9rem}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:1rem;margin:0 0 10px;font-weight:600}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 3px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit}
textarea{min-height:170px;font-family:ui-monospace,monospace;font-size:.85rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:600;padding:10px 16px;border-radius:8px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button.go{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
#status{display:flex;align-items:center;gap:8px;font-weight:600}
#dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}
#dot.on{background:var(--red);box-shadow:0 0 0 4px rgba(229,38,46,.2)}
#log{height:300px;overflow:auto;font-size:.85rem;border:1px solid var(--line);border-radius:8px;padding:8px}
#log div{padding:4px 0;border-bottom:1px solid var(--line)}
.q{color:var(--mute)}.a{color:var(--ok)}.e{color:var(--red)}
@media(max-width:520px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header>
  <img id="logo" alt="Logo" src="logo.png" onerror="this.style.visibility='hidden'">
  <div><h1 id="title">Live Chat Command Bot</h1><div class="sub">Replies to chat commands & AI chat as Mahi</div></div>
</header>

<section>
  <h2>Branding</h2>
  <div class="row">
    <div><label for="logoFile">Choose a logo (png/jpg)</label><input type="file" id="logoFile" accept="image/*"></div>
    <div><label for="ttl">Page title</label><input id="ttl" placeholder="My Live Bot"></div>
  </div>
</section>

<section>
  <h2>Setup</h2>
  <label for="cid">Google OAuth Client ID</label><input id="cid" placeholder="xxxx.apps.googleusercontent.com">
  <label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input id="aion" type="checkbox" checked style="width:auto"> Use AI when no command matches</label>
  <label for="okey">SenseNova API Key</label><input id="okey" type="password" autocomplete="off" value="sk-aSoHLvXGormXY2aoTI8pSRc9DD6WL1Iu">
  <div class="row">
    <div><label for="ourl">SenseNova API URL</label><input id="ourl" value="https://api.sensenova.com/v1/chat/completions"></div>
    <div><label for="omodel">SenseNova Model</label><input id="omodel" value="sensenova-6.8-flash"></div>
  </div>
  <label for="persona">AI style / Persona</label><textarea id="persona" style="min-height:70px"></textarea>
  <div class="row">
    <div><label for="vid">Live video ID (leave empty to use active live)</label><input id="vid" placeholder="dQw4w9WgXcQ"></div>
    <div><label for="poll">Check chat every (seconds)</label><input id="poll" type="number" value="20" min="5"></div>
    <div><label for="gap">Gap between replies (seconds)</label><input id="gap" type="number" value="3" min="2"></div>
    <div><label for="max">Max replies (protects quota)</label><input id="max" type="number" value="150" min="1"></div>
  </div>
  <label for="cmds">Commands (one per line: command = reply). Variables: {user} {time} {date} {dice} {coin}. Put several replies separated by || and one is picked at random.</label>
  <textarea id="cmds"></textarea>
  <div class="bar">
    <button id="login">Sign in with Google</button>
    <button id="start" class="go" disabled>Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</section>

<section>
  <div id="status"><span id="dot"></span><span id="st">Sign in to begin</span></div>
  <div class="sub" id="cnt">Replies: 0</div>
  <h2 style="margin-top:12px">Log</h2>
  <div id="log"></div>
</section>
</main>

<script>
const DEFAULT_CMDS=`!hi = Hello {user}! Welcome to the stream 👋
!hello = Hey {user}! Glad you are here 😊
hi = Hi {user}! 👋
hello = Hello {user}! 👋
!help = Type !commands to see everything I can do
!commands = !hi !rules !about !socials !subscribe !like !share !game !schedule !time !date !dice !coin !joke !8ball !hype !gg !lurk !discord !instagram !telegram !donate
!rules = 1) Be respectful 2) No spam 3) No abusive language 4) No self promotion
!about = Welcome to the channel! Live streams, gaming and fun. Stay and enjoy 🎮
!socials = Find me on Instagram, Discord and Telegram. Type !instagram !discord !telegram
!subscribe = Please subscribe and press the bell icon 🔔
!sub = Please subscribe and press the bell icon 🔔
!like = Smash the like button if you are enjoying the stream 👍
!share = Share the stream with your friends, it helps a lot 🙏
!game = We are playing the current game on stream. Ask in chat if you want to know more 🎮
!schedule = Live every day. Turn on the bell so you never miss a stream 🔔
!time = Current time: {time}
!date = Today's date: {date}
!dice = {user} rolled a {dice} 🎲
!coin = {user} flipped: {coin} 🪙
!joke = Why did the gamer bring a ladder? To reach the high score! || I would tell you a UDP joke, but you might not get it. || Why do programmers prefer dark mode? Because light attracts bugs!
!8ball = Yes, definitely! || No way. || Maybe, ask again later. || Without a doubt. || I would not count on it. || Absolutely!
!hype = LET'S GOOOO {user}! 🔥🔥🔥
!gg = GG {user}! Well played 🏆
!lurk = Thanks for the lurk {user}! Enjoy the stream 👀
!unlurk = Welcome back {user}! 🎉
!discord = Join our Discord: https://discord.gg/TGpDsyVpU
!instagram = Follow me on Instagram: (put your link here)
!telegram = Join our Telegram: (put your link here)
!donate = Support the stream: (put your link here)
!love = Sending love to you {user} ❤️
!bye = Bye {user}! See you next time 👋
!thanks = You are welcome {user}! 😊`;

const $=id=>document.getElementById(id);
const FIELDS=['cid','vid','poll','gap','max','cmds','ttl','okey','ourl','omodel','persona'];
const K=f=>'cb_'+(f==='cmds'?'cmds2':f);
const save=()=>{try{FIELDS.forEach(f=>localStorage.setItem(K(f),$(f).value))}catch(e){}};
$('cmds').value=DEFAULT_CMDS;
$('persona').value='You are Mahi, a friendly AI assistant for this YouTube live stream. If anyone asks who created you or who made you, tell them you were created by Mahi. Reply in the same language as the viewer (English, Hindi or Hinglish). Keep every answer under 180 characters. Politely refuse abusive or harmful requests.';

try{
  FIELDS.forEach(f=>{const v=localStorage.getItem(K(f));if(v!==null&&v!=='')$(f).value=v});
  const lg=localStorage.getItem('cb_logo');if(lg){$('logo').src=lg;$('logo').style.visibility='visible'}
}catch(e){}
try{const a=localStorage.getItem('cb_aion');if(a!==null)$('aion').checked=a==='1'}catch(e){}
$('aion').addEventListener('change',()=>{try{localStorage.setItem('cb_aion',$('aion').checked?'1':'0')}catch(e){}});
if($('ttl').value)$('title').textContent=$('ttl').value;
FIELDS.forEach(f=>$(f).addEventListener('input',()=>{save();if(f==='ttl')$('title').textContent=$('ttl').value||'Live Chat Command Bot'}));

$('logoFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{$('logo').src=r.result;$('logo').style.visibility='visible';try{localStorage.setItem('cb_logo',r.result)}catch(e){log('Logo is too large. Use a smaller file.','e')}};
  r.readAsDataURL(f);
};

function log(t,c=''){const d=document.createElement('div');d.className=c;d.textContent=t;$('log').prepend(d)}
function setSt(t,on){$('st').textContent=t;$('dot').className=on?'on':''}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

let token=null,running=false,queue=[],seen=new Set(),replies=0,me=null,chatId=null,pageToken=null,first=true,used={};

function parseCmds(){
  const map={};
  $('cmds').value.split('\n').forEach(l=>{
    const i=l.indexOf('=');if(i<1)return;
    const k=l.slice(0,i).trim().toLowerCase(),v=l.slice(i+1).trim();
    if(k&&v)map[k]=v;
  });
  return map;
}

$('login').onclick=()=>{
  const cid=$('cid').value.trim();
  if(!cid||!window.google){log('Add your Client ID, then try again.','e');return}
  google.accounts.oauth2.initTokenClient({
    client_id:cid,
    scope:'https://www.googleapis.com/auth/youtube.force-ssl',
    callback:r=>{
      if(r.error){log('Sign-in failed: '+r.error,'e');return}
      token=r.access_token;$('start').disabled=false;setSt('Signed in. Press Start.',false);
    }
  }).requestAccessToken();
};

async function yt(path,opt={}){
  const r=await fetch('https://www.googleapis.com/youtube/v3/'+path,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});
  if(r.status===401){token=null;running=false;setSt('Session expired. Sign in again.',false);throw new Error('Token expired.')}
  const j=await r.json();
  if(!r.ok)throw new Error(j.error?.message||r.status);
  return j;
}

async function findChat(){
  const v=$('vid').value.trim();
  if(v){
    const j=await yt('videos?part=liveStreamingDetails&id='+encodeURIComponent(v));
    return j.items?.[0]?.liveStreamingDetails?.activeLiveChatId;
  }
  const j=await yt('liveBroadcasts?part=snippet&broadcastStatus=active&broadcastType=all&mine=true');
  return j.items?.[0]?.snippet?.liveChatId;
}

async function askAI(q,name){
  let r;
  try{
    r=await fetch($('ourl').value.trim(),{method:'POST',
      headers:{'Authorization':'Bearer '+$('okey').value.trim(),'Content-Type':'application/json'},
      body:JSON.stringify({model:$('omodel').value.trim(),stream:false,messages:[
        {role:'system',content:$('persona').value},
        {role:'user',content:`Viewer ${name} asked: ${q}`}]})});
  }catch(e){throw new Error('AI request failed (network, or the browser blocked it). Check the URL.')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.error&&(j.error.message||j.error))||'AI error '+r.status);
  const t=j.choices?.[0]?.message?.content||j.message?.content||'';
  return t.replace(/\s+/g,' ').trim();
}

async function post(text){
  await yt('liveChat/messages?part=snippet',{method:'POST',body:JSON.stringify({
    snippet:{liveChatId:chatId,type:'textMessageEvent',textMessageDetails:{messageText:text}}})});
}

async function worker(){
  while(running){
    const m=queue.shift();
    if(!m){await sleep(500);continue}
    if(replies>=+$('max').value){log('Max replies reached. Bot stopped.','e');stop();break}
    try{
      let out=m.ai?await askAI(m.text,m.name):m.reply;
      if(!out)continue;
      if(out.includes(' || ')){const p=out.split(' || ');out=p[Math.floor(Math.random()*p.length)].trim()}
      out=out.replace(/\{user\}/g,m.name).replace(/\{time\}/g,new Date().toLocaleTimeString()).replace(/\{date\}/g,new Date().toLocaleDateString()).replace(/\{dice\}/g,1+Math.floor(Math.random()*6)).replace(/\{coin\}/g,Math.random()<.5?'Heads':'Tails');
      out=`@${m.name} ${out}`;
      if(out.length>200)out=out.slice(0,197)+'...';
      await post(out);
      replies++;$('cnt').textContent='Replies: '+replies;
      log(`${m.name}: ${m.text}  →  ${out}`,'a');
    }catch(e){log(e.message,'e');if(/quota/i.test(e.message)){log('Daily quota finished. Bot stopped. Try again after the quota resets.','e');stop();return}}
    await sleep(Math.max(2,+$('gap').value)*1000);
  }
}

async function poller(){
  while(running){
    let wait=10000;
    try{
      const cmds=parseCmds();
      const j=await yt(`liveChat/messages?liveChatId=${chatId}&part=snippet,authorDetails&maxResults=200`+(pageToken?`&pageToken=${pageToken}`:''));
      pageToken=j.nextPageToken;
      wait=Math.max(j.pollingIntervalMillis||5000,Math.max(5,+$('poll').value)*1000);
      for(const it of j.items||[]){
        if(seen.has(it.id))continue;seen.add(it.id);
        if(first)continue;
        if(it.snippet.type!=='textMessageEvent')continue;
        if(it.authorDetails.channelId===me)continue;
        const text=(it.snippet.displayMessage||'').trim();
        const word=text.split(/\s+/)[0].toLowerCase();
        const reply=cmds[word];
        const now=Date.now();
        if(!reply){
          if(!$('aion').checked||text.length<3)continue;
          const uk='u:'+it.authorDetails.channelId;
          if(used[uk]&&now-used[uk]<20000)continue;
          used[uk]=now;
          if(queue.length<20)queue.push({name:it.authorDetails.displayName,text,ai:true});
          continue;
        }
        if(used[word]&&now-used[word]<10000)continue;
        used[word]=now;
        if(queue.length<20)queue.push({name:it.authorDetails.displayName,text,reply});
      }
      first=false;
    }catch(e){log(e.message,'e');if(/quota/i.test(e.message)){log('Daily quota finished. Bot stopped. Try again after the quota resets.','e');stop();return}}
    await sleep(wait);
  }
}

$('start').onclick=async()=>{
  try{
    setSt('Looking for your live chat...',false);
    me=(await yt('channels?part=id&mine=true')).items?.[0]?.id;
    chatId=await findChat();
    if(!chatId){setSt('No active live stream found',false);log('Start your live or enter a video ID.','e');return}
    if($('aion').checked&&!$('okey').value.trim())log('AI is on but the API key is empty. Only commands will work.','e');
    running=true;first=true;pageToken=null;queue=[];used={};
    $('start').disabled=true;$('stop').disabled=false;
    setSt('LIVE: bot is running',true);
    log('Bot started. Commands loaded: '+Object.keys(parseCmds()).join(' '),'a');
    poller();worker();
  }catch(e){log(e.message,'e');setSt('Error',false)}
};
function stop(){running=false;$('start').disabled=!token;$('stop').disabled=true;setSt('Stopped',false)}
$('stop').onclick=stop;
</script>
</body>
  </html>
